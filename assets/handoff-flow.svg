<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
<title id="title">AI Handoff Check example</title>
<desc id="desc">ChatGPT produces brief version two, while a receiving AI still uses version one. File arrival is verified, but the version check flags a stale input. Checking task output remains separate.</desc>
<defs>
 <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#F8FAFC"/><stop offset="1" stop-color="#EEF5FF"/></linearGradient>
 <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="8" stdDeviation="13" flood-color="#243B53" flood-opacity=".10"/></filter>
</defs>
<rect width="1200" height="650" rx="28" fill="url(#bg)"/>
<g font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, Arial, sans-serif">
 <text x="60" y="76" fill="#10243D" font-size="34" font-weight="750">Two AIs. One task. Different versions.</text>
 <text x="60" y="109" fill="#51637A" font-size="19">A receiving AI says “Done.” But did it use your latest file?</text>

 <rect x="58" y="152" width="390" height="189" rx="22" fill="#FFFFFF" stroke="#D8E4EF" filter="url(#shadow)"/>
 <rect x="80" y="174" width="110" height="32" rx="16" fill="#E6F5F2"/>
 <text x="135" y="196" font-size="17" font-weight="650" fill="#057865" text-anchor="middle">ChatGPT</text>
 <text x="83" y="248" font-size="29" font-weight="750" fill="#172940">brief.md</text>
 <text x="83" y="280" font-size="18" fill="#50657C">Same path · current content v2</text>
 <rect x="82" y="298" width="152" height="26" rx="13" fill="#DDF6EB"/>
 <text x="158" y="317" font-size="16" font-weight="650" text-anchor="middle" fill="#0D7857">SOURCE v2</text>

 <path d="M474 247 H718" stroke="#6B8097" stroke-width="4" stroke-linecap="round" stroke-dasharray="12 10"/>
 <path d="M701 233 L719 247 L701 261" fill="none" stroke="#6B8097" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
 <text x="595" y="216" font-size="18" fill="#6B8097" text-anchor="middle">Existing transfer</text>

 <rect x="749" y="152" width="390" height="189" rx="22" fill="#FFFFFF" stroke="#D8E4EF" filter="url(#shadow)"/>
 <rect x="771" y="174" width="147" height="32" rx="16" fill="#E8EAFD"/>
 <text x="844" y="196" font-size="17" font-weight="650" fill="#4851BA" text-anchor="middle">Receiving AI</text>
 <text x="773" y="248" font-size="29" font-weight="750" fill="#172940">brief.md</text>
 <text x="773" y="280" font-size="18" fill="#50657C">Same path · last delivered v1</text>
 <rect x="772" y="298" width="179" height="26" rx="13" fill="#FEEBE8"/>
 <text x="862" y="317" font-size="16" font-weight="650" text-anchor="middle" fill="#B63B38">RECEIVED v1</text>

 <text x="60" y="414" font-size="30" font-weight="750" fill="#10243D">AI Handoff Check</text>
 <text x="60" y="441" font-size="18" fill="#51637A">Verify the handoff — not just the worker’s claim.</text>

 <rect x="58" y="471" width="344" height="108" rx="20" fill="#FFFFFF" stroke="#B8E2D5"/>
 <circle cx="95" cy="508" r="19" fill="#E1F5E8"/>
 <path d="M86 508 l7 7 12 -15" stroke="#198254" stroke-width="4" fill="none" stroke-linecap="round"/>
 <text x="128" y="510" font-size="20" font-weight="720" fill="#1C324B">File arrived?</text>
 <text x="128" y="541" font-size="17" fill="#24765D">YES · Captured v1 matches</text>

 <rect x="427" y="471" width="344" height="108" rx="20" fill="#FFFFFF" stroke="#F5C8BC"/>
 <circle cx="464" cy="508" r="19" fill="#FEEBE8"/>
 <path d="M456 500 l16 16 M472 500 l-16 16" stroke="#BE4C42" stroke-width="4" stroke-linecap="round"/>
 <text x="497" y="510" font-size="20" font-weight="720" fill="#1C324B">Latest version?</text>
 <text x="497" y="541" font-size="17" fill="#AF4D42">NO · Source v2 ≠ v1</text>

 <rect x="796" y="471" width="344" height="108" rx="20" fill="#FFFFFF" stroke="#D1DCE9"/>
 <circle cx="833" cy="508" r="19" fill="#EAF0FA"/>
 <text x="833" y="515" font-size="27" font-weight="700" fill="#607891" text-anchor="middle">?</text>
 <text x="866" y="510" font-size="20" font-weight="720" fill="#1C324B">Correct output?</text>
 <text x="866" y="541" font-size="17" fill="#5B6E83">Needs a separate test</text>
 <text x="60" y="619" font-size="15" fill="#63778C">Illustrative example · Works with your existing transfer · Does not copy files or synchronize native memory</text>
</g>
</svg>